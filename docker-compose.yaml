services:
  migrate:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Portainer env vars}
    command: [ "pnpm", "exec", "prisma", "migrate", "deploy" ]
    restart: "no"

  nextjs:
    build: .
    image: storytelling-app
    pull_policy: build
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Portainer env vars}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in Portainer env vars}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in Portainer env vars}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.storytelling-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.storytelling-redirect.redirectscheme.permanent=true"
      - "traefik.http.routers.storytelling-http.middlewares=storytelling-redirect"
      - "traefik.http.routers.storytelling-http.rule=Host(`storybookmentalhealth.docchula.com`)"
      - "traefik.http.routers.storytelling-http.entrypoints=web"
      - "traefik.http.routers.storytelling-https.rule=Host(`storybookmentalhealth.docchula.com`)"
      - "traefik.http.routers.storytelling-https.entrypoints=websecure"
      - "traefik.http.routers.storytelling-https.tls.certresolver=leresolver"
      - "traefik.http.services.storytelling-https.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5