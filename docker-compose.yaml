services:
  migrate:
    build: .
    env_file:
      - stack.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in stack.env}
    command: [ "pnpm", "exec", "prisma", "migrate", "deploy" ]
    restart: "no"

  nextjs:
    build: .
    env_file:
      - stack.env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in stack.env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?Set NEXTAUTH_URL in stack.env}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in stack.env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.storytelling.rule=Host(`storybookmentalhealth.docchula.com`)"
      - "traefik.http.routers.storytelling.entrypoints=websecure"
      - "traefik.http.routers.storytelling.tls.certresolver=letsencrypt"
      - "traefik.http.services.storytelling.loadbalancer.server.port=3000"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
