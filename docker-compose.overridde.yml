services:
  db-local:
    image: mariadb:10.11
    profiles: [ "local" ]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD in .env.local}
      MARIADB_ROOT_HOST: "%"
      MARIADB_DATABASE: tellstory
    ports:
      - "127.0.0.1:3600:3306"
    volumes:
      - tellstory-db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tellstory-db-data:
